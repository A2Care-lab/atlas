<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/atlas-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="description" content="ATLAS – Integridade Corporativa" />
    <link rel="manifest" href="/manifest.json" />
    <title>ATLAS – Integridade Corporativa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      if ('serviceWorker' in navigator) {
        const qs = new URLSearchParams(location.search || '')
        const disableSw = qs.get('no-sw') === '1'
        const isLoopbackHost =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.hostname === '[::1]'
        const shouldDisableSw = import.meta.env.DEV || isLoopbackHost || disableSw

        if (shouldDisableSw) {
          navigator.serviceWorker.getRegistrations()
            .then((regs) => Promise.allSettled(regs.map((r) => r.unregister())))
            .catch(() => {})

          if (window.caches) {
            caches.keys()
              .then((keys) => Promise.allSettled(keys.map((k) => caches.delete(k))))
              .catch(() => {})
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                console.log('SW registered: ', registration);
                if (registration.waiting) { registration.waiting.postMessage({ type: 'SKIP_WAITING' }) }
                registration.update().catch(() => {})
              })
              .catch((registrationError) => {
                console.log('SW registration failed: ', registrationError);
              });
          });
        }
      }
    </script>
  </body>
</html>
