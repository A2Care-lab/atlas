<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#006D77"/>
      <stop offset="1" stop-color="#005B63"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background removed to be transparent -->
  <g opacity="0.3">
    <circle cx="300" cy="200" r="160" fill="url(#light)"/>
    <circle cx="950" cy="150" r="120" fill="url(#light)"/>
    <circle cx="850" cy="600" r="180" fill="url(#light)"/>
  </g>
  <!-- Bottom Card (Now Dark Glass) -->
  <g transform="translate(140,420)">
    <rect x="0" y="0" width="920" height="260" rx="24" fill="#0f172a" opacity="0.4" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    <!-- Inner blocks converted to subtle light overlays -->
    <rect x="24" y="24" width="420" height="140" rx="12" fill="#ffffff" opacity="0.05"/>
    <rect x="466" y="24" width="420" height="140" rx="12" fill="#ffffff" opacity="0.05"/>
    <rect x="24" y="176" width="862" height="60" rx="10" fill="#ffffff" opacity="0.05"/>
    <!-- Buttons/Actions -->
    <rect x="48" y="188" width="200" height="36" rx="8" fill="#006D77" opacity="0.8"/>
    <rect x="268" y="188" width="200" height="36" rx="8" fill="#ffffff" opacity="0.1"/>
    <rect x="488" y="188" width="200" height="36" rx="8" fill="#ffffff" opacity="0.1"/>
    <rect x="708" y="188" width="150" height="36" rx="8" fill="#ffffff" opacity="0.1"/>
  </g>
  <!-- Top Card (Dark Glass) -->
  <g transform="translate(280,220)">
    <rect x="0" y="0" width="640" height="320" rx="24" fill="#0f172a" opacity="0.6" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <g transform="translate(60,40)">
      <rect x="0" y="0" width="520" height="24" rx="6" fill="#ffffff" opacity="0.2"/>
      <rect x="0" y="48" width="420" height="18" rx="6" fill="#ffffff" opacity="0.1"/>
      <rect x="0" y="80" width="460" height="18" rx="6" fill="#ffffff" opacity="0.1"/>
      <rect x="0" y="112" width="380" height="18" rx="6" fill="#ffffff" opacity="0.1"/>
    </g>
    <g transform="translate(60,190)">
      <rect x="0" y="0" width="150" height="42" rx="8" fill="#006D77" opacity="0.9"/>
      <rect x="170" y="0" width="210" height="42" rx="8" fill="#ffffff" opacity="0.1"/>
    </g>
  </g>
  <!-- Right Floating Card (Dark Glass) -->
  <g transform="translate(860,360)">
    <rect x="-40" y="0" width="280" height="200" rx="16" fill="#0f172a" opacity="0.8" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <rect x="-20" y="20" width="240" height="24" rx="6" fill="#ffffff" opacity="0.2"/>
    <rect x="-20" y="60" width="200" height="16" rx="6" fill="#ffffff" opacity="0.1"/>
    <rect x="-20" y="88" width="220" height="16" rx="6" fill="#ffffff" opacity="0.1"/>
    <rect x="-20" y="116" width="180" height="16" rx="6" fill="#ffffff" opacity="0.1"/>
  </g>
</svg>
