<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Background removed for transparency -->
  <g transform="translate(180,220)">
    <!-- Main Card: Dark Glass -->
    <rect x="0" y="0" width="840" height="400" rx="28" fill="#0f172a" opacity="0.6" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    
    <!-- Text Lines: Subtle White Overlay -->
    <rect x="32" y="32" width="500" height="28" rx="8" fill="#FFFFFF" opacity="0.1"/>
    <rect x="32" y="80" width="420" height="18" rx="8" fill="#FFFFFF" opacity="0.05"/>
    <rect x="32" y="110" width="520" height="18" rx="8" fill="#FFFFFF" opacity="0.05"/>
    <rect x="32" y="140" width="360" height="18" rx="8" fill="#FFFFFF" opacity="0.05"/>
    
    <!-- Buttons -->
    <g transform="translate(32,190)">
      <!-- Primary Action -->
      <rect x="0" y="0" width="180" height="50" rx="10" fill="#006D77" opacity="0.9"/>
      <!-- Secondary Actions -->
      <rect x="200" y="0" width="220" height="50" rx="10" fill="#FFFFFF" opacity="0.1"/>
      <rect x="440" y="0" width="180" height="50" rx="10" fill="#FFFFFF" opacity="0.1"/>
    </g>
    
    <!-- Floating Small Card: Dark Glass -->
    <g transform="translate(560,240)">
      <rect x="0" y="0" width="248" height="140" rx="12" fill="#0f172a" opacity="0.8" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
      <!-- Inner Lines -->
      <rect x="16" y="16" width="216" height="20" rx="6" fill="#FFFFFF" opacity="0.1"/>
      <rect x="16" y="48" width="180" height="16" rx="6" fill="#FFFFFF" opacity="0.05"/>
      <rect x="16" y="74" width="200" height="16" rx="6" fill="#FFFFFF" opacity="0.05"/>
      <rect x="16" y="100" width="150" height="16" rx="6" fill="#FFFFFF" opacity="0.05"/>
    </g>
  </g>
  
  <!-- Decorative Circles -->
  <g transform="translate(960,140)" opacity="0.4">
    <circle cx="0" cy="0" r="100" fill="#99CFD7" opacity="0.2"/>
    <circle cx="-80" cy="200" r="60" fill="#66B7C3" opacity="0.2"/>
    <circle cx="50" cy="300" r="90" fill="#339FAA" opacity="0.2"/>
  </g>
</svg>
